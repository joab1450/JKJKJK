<title>Presente</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-height: 100%;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: clamp(16px, 4vw, 50px);

        background:
            radial-gradient(
                circle at 50% 45%,
                #242424 0%,
                #111111 42%,
                #070707 100%
            );

        color: #fff;
        font-family: Arial, Helvetica, sans-serif;

        overflow-x: hidden;
    }

    /* Luz ambiente */
    body::before {
        content: "";
        position: fixed;

        width: min(55vw, 600px);
        aspect-ratio: 1;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.035);
        filter: blur(100px);

        animation: ambiente 8s ease-in-out infinite alternate;

        pointer-events: none;
    }

    @keyframes ambiente {
        0% {
            transform: translate(-55%, -50%) scale(0.9);
        }

        100% {
            transform: translate(-45%, -50%) scale(1.1);
        }
    }

    /* Pequenos pontos de luz */
    body::after {
        content: "";

        position: fixed;
        inset: 0;

        background-image:
            radial-gradient(
                circle,
                rgba(255,255,255,0.16) 1px,
                transparent 1px
            );

        background-size: clamp(35px, 5vw, 60px) clamp(35px, 5vw, 60px);

        opacity: 0.15;

        animation: estrelas 25s linear infinite;

        pointer-events: none;
    }

    @keyframes estrelas {
        from {
            background-position: 0 0;
        }

        to {
            background-position: 100px 100px;
        }
    }

    .container {
        position: relative;
        z-index: 2;

        width: 100%;
        max-width: 820px;

        padding: clamp(25px, 5vw, 55px);

        background: rgba(15, 15, 15, 0.88);

        border: 1px solid rgba(255, 255, 255, 0.09);

        border-radius: clamp(14px, 2vw, 22px);

        text-align: center;

        box-shadow:
            0 25px 80px rgba(0, 0, 0, 0.65),
            inset 0 1px rgba(255,255,255,0.03);

        backdrop-filter: blur(12px);

        animation: entrada 1.2s ease-out;
    }

    @keyframes entrada {
        from {
            opacity: 0;
            transform: translateY(25px) scale(0.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    h1 {
        margin: 0;

        font-size: clamp(30px, 5vw, 48px);

        font-weight: 300;

        letter-spacing: clamp(4px, 1vw, 9px);

        color: #f2f2f2;

        animation: brilho 4s ease-in-out infinite alternate;
    }

    @keyframes brilho {
        from {
            text-shadow: 0 0 5px rgba(255,255,255,0.05);
        }

        to {
            text-shadow: 0 0 25px rgba(255,255,255,0.25);
        }
    }

    .linha {
        width: clamp(40px, 10vw, 70px);
        height: 1px;

        margin: clamp(16px, 3vw, 24px) auto;

        background: rgba(255,255,255,0.35);
    }

    .mensagem {
        margin-bottom: clamp(18px, 3vw, 28px);

        color: #999;

        font-size: clamp(11px, 1.5vw, 14px);

        letter-spacing: clamp(1px, 0.4vw, 2px);

        line-height: 1.6;
    }

    .video-container {
        position: relative;

        width: 100%;

        aspect-ratio: 16 / 9;

        overflow: hidden;

        border-radius: clamp(8px, 1.5vw, 14px);

        background: #000;

        box-shadow:
            0 15px 45px rgba(0,0,0,0.65);

        transition: transform 0.4s ease,
                    box-shadow 0.4s ease;
    }

    .video-container:hover {
        transform: scale(1.01);

        box-shadow:
            0 20px 55px rgba(0,0,0,0.8);
    }

    video {
        width: 100%;
        height: 100%;

        display: block;

        object-fit: contain;

        background: #000;
    }

    .frase {
        margin-top: clamp(18px, 3vw, 28px);

        color: #707070;

        font-size: clamp(11px, 1.4vw, 13px);

        letter-spacing: clamp(0.5px, 0.2vw, 1.5px);

        line-height: 1.6;

        opacity: 0;

        animation: aparecerTexto 2s ease 1.5s forwards;
    }

    @keyframes aparecerTexto {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Celulares */
    @media (max-width: 600px) {

        body {
            padding: 12px;
        }

        .container {
            padding: 28px 18px;
        }

        .mensagem {
            max-width: 280px;
            margin-left: auto;
            margin-right: auto;
        }

        .video-container {
            border-radius: 9px;
        }
    }

    /* Celulares muito pequenos */
    @media (max-width: 380px) {

        body {
            padding: 8px;
        }

        .container {
            padding: 24px 14px;
        }

        h1 {
            letter-spacing: 3px;
        }
    }

    /* Monitores muito grandes */
    @media (min-width: 1600px) {

        .container {
            max-width: 900px;
        }
    }

    /* Telas com pouca altura */
    @media (max-height: 650px) {

        body {
            align-items: flex-start;
            padding-top: 25px;
            padding-bottom: 25px;
        }
    }

</style>
```

</head>

```
<main class="container">

    <h1>Presente</h1>

    <div class="linha"></div>

    <div class="mensagem">
        um pequeno momento para guardar
    </div>

    <div class="video-container">
        <video controls preload="metadata">
            <source src="video.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <div class="frase">
        algumas lembranças simplesmente ficam.
    </div>

</main>
